name: Sync safetempcleaner manifest

on:
  workflow_dispatch:
  schedule:
    # Daily pull from SafeTempCleaner main branch
    - cron: '0 5 * * *'
  repository_dispatch:
    types: [sync-safetempcleaner-manifest]

permissions:
  contents: write

jobs:
  sync:
    name: Sync from SafeTempCleaner
    runs-on: windows-latest
    steps:
      - name: Checkout Bucket
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Checkout Scoop
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ScoopInstaller/Scoop
          path: scoop_core
      - name: Sync manifest
        shell: pwsh
        env:
          SCOOP_HOME: ${{ github.workspace }}/scoop_core
        run: .\bin\sync-safetempcleaner.ps1
      - name: Commit and push if changed
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bucket/safetempcleaner.json
          git diff --staged --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'safetempcleaner manifest already in sync.'
            exit 0
          }
          git commit -m "safetempcleaner: Sync manifest from SafeTempCleaner"
          git push
